name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check firmware utilities
        run: |
          for source in tests/activity_led.test.cpp tests/trace_retention.test.cpp tests/connection_cancellation.test.cpp tests/scan_retention.test.cpp; do
            c++ -std=c++17 -Wall -Wextra -Werror "$source" -o /tmp/firmware-test
            /tmp/firmware-test
          done
      - run: python3 tests/pwa_bridge_test.py
      - run: python3 tests/metadata_catalog_test.py
      - run: npx wrangler deploy --dry-run
  deploy:
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
